<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101827">
  <title>Page introuvable (404) — Jérémy Bruguet</title>
  <meta name="description" content="La page demandée est introuvable.">
  <link rel="icon" href="https://jeremy-bruguet.github.io/portfolio/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#101827;--panel:#172338;--text:#f4f7fb;--muted:#bac7d8;--blue:#79b8ff;--orange:#ffb36b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 15%,#203b5b 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px}
    main{width:min(100%,980px);display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:42px;background:rgba(23,35,56,.8);border:1px solid #31435d;border-radius:28px;padding:clamp(24px,5vw,56px);box-shadow:0 24px 80px #0003}
    .eyebrow{color:var(--orange);font-weight:750;text-transform:uppercase;letter-spacing:.14em;font-size:.82rem}.code{display:block;font-size:clamp(5rem,13vw,9rem);line-height:.98;font-weight:850;letter-spacing:-.08em;color:var(--blue)}h1{font-size:clamp(2rem,4vw,3.4rem);line-height:1.1;letter-spacing:-.04em;margin:.25em 0}p{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:12px;background:var(--blue);color:#102033;text-decoration:none;font-weight:750}.btn.secondary{background:transparent;color:var(--text);border:1px solid #53657d}.mascot{margin:0;text-align:center}.mascot img{width:100%;max-width:320px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 18px 24px #0004)}figcaption{font-size:.9rem;color:var(--muted)}a:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
    @media(max-width:680px){main{grid-template-columns:1fr;gap:22px}.mascot{grid-row:1}.mascot img{max-width:210px}.code{font-size:6rem}}
  </style>
</head>
<body>
  <main>
    <section>
      <p class="eyebrow">Erreur 404</p>
      <h1><span class="code">404</span>Page introuvable</h1>
      <p>La page que vous cherchez n’existe pas ou a été déplacée. Flammy a fouillé partout sans la trouver.</p>
      <p class="actions">
        <a class="btn" href="https://jeremy-bruguet.github.io/portfolio/">Retour au portfolio</a>
        <a class="btn secondary" href="javascript:history.back()">Page précédente</a>
      </p>
    </section>
    <figure class="mascot">
      <img src="https://jeremy-bruguet.github.io/portfolio/assets/flammy.jpg" alt="Flammy, la mascotte du portfolio de Jérémy Bruguet" width="960" height="960">
      <figcaption>Flammy a cherché partout. Rien.</figcaption>
    </figure>
  </main>
</body>
</html>
